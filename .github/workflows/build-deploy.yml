name: build-deploy

# Build the Hermes image + the plugins image, push both to GHCR (pinned to the
# commit SHA), then roll the cluster to the new tags via `kubectl set image`.
on:
  push:
    branches: [deploy]
  workflow_dispatch: {}

concurrency:
  group: build-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR requires a lowercase owner; github.repository_owner may be mixed-case.
  # We lowercase it in the first step and pass it downstream.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with GITHUB_TOKEN
    outputs:
      owner_lc: ${{ steps.vars.outputs.owner_lc }}
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # pull hermes-plugins at its pinned commit
          fetch-depth: 0
          # hermes-plugins is a SEPARATE private repo, so the default
          # GITHUB_TOKEN can't clone it. Provide a PAT (classic: repo scope, or
          # fine-grained: read Contents on hermes-plugins) as secret
          # SUBMODULE_TOKEN. Falls back to GITHUB_TOKEN if you make the repo public.
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - id: vars
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Main Hermes image (upstream Dockerfile, untouched).
      - name: Build & push hermes-agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/hermes-agent:${{ steps.vars.outputs.sha }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/hermes-agent:deploy
          cache-from: type=gha,scope=hermes-agent
          cache-to: type=gha,scope=hermes-agent,mode=max

      # Tiny plugins image (deploy/plugins.Dockerfile).
      - name: Build & push hermes-plugins
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/plugins.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/hermes-plugins:${{ steps.vars.outputs.sha }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/hermes-plugins:deploy
          cache-from: type=gha,scope=hermes-plugins
          cache-to: type=gha,scope=hermes-plugins,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Roll out new images
        env:
          OWNER: ${{ needs.build.outputs.owner_lc }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -eu
          kubectl -n hermes set image statefulset/hermes \
            hermes=ghcr.io/$OWNER/hermes-agent:$SHA
          kubectl -n hermes patch statefulset/hermes --type=json -p="[
            {\"op\":\"replace\",
             \"path\":\"/spec/template/spec/initContainers/0/image\",
             \"value\":\"ghcr.io/$OWNER/hermes-plugins:$SHA\"}
          ]"
          kubectl -n hermes rollout status statefulset/hermes --timeout=5m
