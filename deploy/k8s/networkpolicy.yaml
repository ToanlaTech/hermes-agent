# Least-privilege: deny all ingress (gateway is outbound-only), allow only
# HTTPS egress (LLM providers + messaging platforms) and DNS.
# NOTE: `kubectl port-forward` bypasses NetworkPolicy (it goes API server ->
# kubelet), so denying ingress does not break dashboard port-forwarding.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow the shared ingress-nginx controller to reach the dashboard (9119)
    # and the OpenAI-compatible API server (8642). Both are still auth-gated at
    # the app layer (dashboard form-login / API_SERVER_KEY bearer token).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 9119
        - protocol: TCP
          port: 8642
        # files-server sidecar (public file drop at /files/). Content here is
        # intentionally public; the sidecar only exposes the /opt/data/files
        # subdir, never the rest of the volume.
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
