# TEMPLATE ONLY — do NOT commit real values.
# Hermes reads these from the process environment (os.getenv), e.g.
# hermes_cli/auth.py:1757 checks OPENROUTER_API_KEY / OPENAI_API_KEY.
# So injecting them as env vars (envFrom) is enough — no ~/.hermes/.env needed.
#
# Create the real Secret out-of-band (never in git):
#   kubectl -n hermes create secret generic hermes-secrets \
#     --from-literal=OPENROUTER_API_KEY=sk-or-v1-xxxx \
#     --from-literal=API_SERVER_KEY=$(openssl rand -hex 32)
#   # add bot tokens only for the gateways you actually enable, e.g.:
#   #   --from-literal=TELEGRAM_BOT_TOKEN=123456:abc
#
apiVersion: v1
kind: Secret
metadata:
  name: hermes-secrets
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-agent
type: Opaque
stringData:
  OPENROUTER_API_KEY: "REPLACE_ME"
  # API_SERVER_KEY is mandatory only if you enable the OpenAI-compatible API
  # server (API_SERVER_HOST). Keep it set; it is harmless when the server is off.
  API_SERVER_KEY: "REPLACE_ME"
  # --- Optional gateway tokens: uncomment only the ones you use ---
  # TELEGRAM_BOT_TOKEN: "REPLACE_ME"
  # DISCORD_BOT_TOKEN: "REPLACE_ME"
  # SLACK_BOT_TOKEN: "REPLACE_ME"
  # SLACK_APP_TOKEN: "REPLACE_ME"
